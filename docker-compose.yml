services:
  postgres:
    image: postgres:15
    container_name: wirecloud-postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: wirecloud
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - wirecloud-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:2.4
    container_name: wirecloud-elasticsearch
    restart: always
    command: elasticsearch -Des.index.max_result_window=50000
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - wirecloud-net

  memcached:
    image: memcached:1
    container_name: wirecloud-memcached
    restart: always
    command: memcached -m 512m
    networks:
      - wirecloud-net

  wirecloud:
    image: fiware/wirecloud:latest
    container_name: wirecloud
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      memcached:
        condition: service_started
    expose:
      - "8000"
    environment:
      - DEBUG=False
      - DEFAULT_THEME=wirecloud.defaulttheme
      - DB_HOST=postgres
      - DB_PASSWORD=wirecloud
      - FORWARDED_ALLOW_IPS=*
      - ELASTICSEARCH2_URL=http://elasticsearch:9200/
      - MEMCACHED_LOCATION=memcached:11211
    volumes:
      - wirecloud-data:/opt/wirecloud_instance/data
      - wirecloud-static:/var/www/static
    networks:
      - wirecloud-net

  nginx:
    image: nginx:stable
    container_name: wirecloud-nginx
    restart: always
    depends_on:
      - wirecloud
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - wirecloud-static:/var/www/static:ro
    networks:
      - wirecloud-net

  mongo:
    image: mongo:4.4
    container_name: orion-mongo
    restart: always
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'echo ''db.runCommand("ping").ok'' | mongo localhost:27017/test --quiet',
        ]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - wirecloud-net

  orion-ld:
    image: fiware/orion-ld:latest
    container_name: orion-ld
    hostname: orion-ld
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    command: -dbhost mongo -logLevel ERROR
    ports:
      - "1026:1026"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1026/version"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - wirecloud-net

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: mosquitto
    hostname: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -t '$$SYS/#' -C 1 -W 3 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wirecloud-net

  iot-agent:
    image: telefonicaiot/iotagent-json:latest
    container_name: fiware-iot-agent
    hostname: iot-agent
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      orion-ld:
        condition: service_healthy
    ports:
      - "4041:4041"
      - "7896:7896"
    environment:
      - IOTA_CB_HOST=orion-ld
      - IOTA_CB_PORT=1026
      - IOTA_CB_NGSI_VERSION=ld
      - IOTA_JSON_LD_CONTEXT=https://uri.etsi.org/ngsi-ld/v1/ngsi-ld-core-context.jsonld
      - IOTA_FALLBACK_TENANT=openiot
      - IOTA_APPEND_MODE=true
      - IOTA_NORTH_PORT=4041
      - IOTA_REGISTRY_TYPE=mongodb
      - IOTA_MONGO_URI=mongodb://mongo:27017/iotagentjson
      - IOTA_MQTT_HOST=mosquitto
      - IOTA_MQTT_PORT=1883
      - IOTA_HTTP_PORT=7896
      - IOTA_DEFAULT_RESOURCE=/iot/json
      - IOTA_PROVIDER_URL=http://iot-agent:4041
      - IOTA_AUTOCACHE=true
      - IOTA_AUTOCAST=true
      - IOTA_TIMESTAMP=true
      - IOTA_LOG_LEVEL=DEBUG
      - IOTA_DEFAULT_EXPRESSION_LANGUAGE=jexl
    networks:
      - wirecloud-net

volumes:
  mosquitto-data:
  mongo-data:
  postgres-data:
  elasticsearch-data:
  wirecloud-data:
  wirecloud-static:

networks:
  wirecloud-net:
    driver: bridge
