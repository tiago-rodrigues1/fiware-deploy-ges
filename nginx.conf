upstream wirecloud {
    server wirecloud:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    # Arquivos estáticos (JS, CSS, imagens) gerados pelo collectstatic
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    # Todo o resto vai para o WireCloud (Gunicorn)
    location / {
        proxy_pass http://wirecloud;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}